<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangul Quiz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hangul Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F7FB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --accent:#7A1F2B; --accent-soft:#F6E9EB; --ground:#F6F7FB; --card:#FFFFFF;
  --ink:#1B1F2A; --muted:#5A6070; --line:#D7DBE6; --rule:#ECEEF4;
  --ok:#1F6B45; --ok-soft:#E5F2EA; --bad:#A2470A; --bad-soft:#FBEDE3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation}
.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif}
button,input,a{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.screen[hidden]{display:none}
h1{margin:0;font-size:28px;font-weight:700}
.label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:18px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:22px}.tile span{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#E6E9F2;padding:4px;border-radius:14px}
.seg button{height:48px;border:0;border-radius:11px;background:transparent;font-size:17px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(20,30,60,.12)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left;padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:16px;font-weight:600;color:var(--ink)}.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.mode[aria-pressed="true"] b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border:1.5px solid var(--line);border-radius:22px;background:var(--card);padding:0 16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink)}
.chip svg{display:none}
.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] svg{display:block}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.primary{height:58px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:700}
.secondary{height:50px;border:0;border-radius:16px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.primary:disabled{opacity:.5}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.bar{height:6px;border-radius:3px;background:#E1E5EF;overflow:hidden}
.bar div{height:6px;background:var(--accent);border-radius:3px;transition:width .2s}
.big{flex-grow:1;min-height:300px;background:var(--card);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.big .ko{font-size:min(52vw,220px);font-weight:700;line-height:1.05}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:68px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;color:var(--ink)}
.opt b{font-size:19px;font-weight:600}.opt span{font-size:14px;color:var(--muted)}
.opt.ok{border:2px solid var(--ok);background:var(--ok-soft)}.opt.ok b{color:var(--ok)}
.opt.bad{border:2px solid var(--bad);background:var(--bad-soft)}.opt.bad b{color:var(--bad)}
.score{padding:28px 24px;display:flex;align-items:center;justify-content:space-between}
.score b{font-size:52px;line-height:1;color:var(--accent)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .ko{font-size:32px;font-weight:700;width:48px;text-align:center}
.row .r{font-size:17px;font-weight:600;flex-grow:1}
.row .p{font-size:14px;color:var(--bad)}
.table{overflow:hidden}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) 60px 64px;gap:8px;padding:10px 16px;align-items:center;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.thead{font-size:12px;font-weight:600;color:var(--muted)}
.trow .ko{font-size:28px;font-weight:700}
.num{text-align:right;font-size:15px}
.low{color:var(--bad);font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.outline{height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.fill{height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
.empty{padding:18px;color:var(--muted);font-size:15px}
.note{font-size:14px;color:var(--muted);margin:0}
.error{padding:16px;border-radius:14px;background:var(--bad-soft);color:var(--bad)}
</style>
</head>
<body>

<!-- Home -->
<section class="screen" id="home">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="ko" style="font-size:44px;font-weight:700;color:var(--accent);line-height:1">한글</div>
    <h1>Hangul Quiz</h1>
    <p class="note" id="countLine">Loading characters…</p>
  </div>
  <div id="loadError" class="error" hidden></div>
  <div class="tiles">
    <div class="tile"><b id="tSessions">0</b><span>Sessions</span></div>
    <div class="tile"><b id="tAccuracy">–</b><span>Accuracy</span></div>
    <div class="tile"><b id="tUntested">0</b><span>Never tested</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span class="label">Questions</span>
    <div class="seg" id="lengths">
      <button type="button" data-len="10">10</button>
      <button type="button" data-len="20">20</button>
      <button type="button" data-len="50">50</button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span class="label">Categories</span>
    <div class="chips" id="cats"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span class="label">Pick questions by</span>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-mode="random"><b>Random</b><span>Any letter or syllable</span></button>
      <button type="button" class="mode" data-mode="least"><b>Least tested</b><span>Shown the fewest times first</span></button>
      <button type="button" class="mode" data-mode="failed"><b>Most failed</b><span>Highest share of wrong answers first</span></button>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="primary" id="startBtn" disabled>Start quiz</button>
    <button type="button" class="secondary" id="statsBtn">Statistics and backup</button>
  </div>
</section>

<!-- Quiz -->
<section class="screen" id="quiz" hidden>
  <div class="topbar">
    <button type="button" class="iconbtn" id="quitBtn" aria-label="Quit session">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1F2A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span class="muted" style="font-size:14px;font-weight:600" id="qMode"></span>
    <span style="font-size:16px;font-weight:700" id="qCount"></span>
  </div>
  <div class="bar"><div id="qBar" style="width:0"></div></div>
  <div class="big">
    <span class="ko" id="qChar" lang="ko"></span>
    <span class="muted" style="font-size:14px" id="qType"></span>
  </div>
  <div class="opts" id="qOpts"></div>
</section>

<!-- Result -->
<section class="screen" id="result" hidden>
  <div style="display:flex;flex-direction:column;gap:4px">
    <span class="muted" style="font-size:14px;font-weight:600" id="rMeta"></span>
    <h1>Session result</h1>
  </div>
  <div class="card score">
    <div style="display:flex;flex-direction:column;gap:4px"><b id="rScore"></b><span class="muted" style="font-size:15px">correct</span></div>
    <span style="font-size:32px;font-weight:700" id="rPct"></span>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <span class="label">Missed this time</span>
    <div class="card list" id="rMissed"></div>
  </div>
  <div class="actions">
    <button type="button" class="primary" id="againBtn">New session</button>
    <button type="button" class="secondary" id="homeBtn">Home</button>
  </div>
</section>

<!-- Statistics -->
<section class="screen" id="stats" hidden>
  <div class="topbar" style="justify-content:flex-start">
    <button type="button" class="iconbtn" id="backBtn" aria-label="Back to home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1F2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 style="font-size:26px">Statistics</h1>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="label">Backup</span>
    <div class="two">
      <button type="button" class="fill" id="exportBtn">Export stats</button>
      <button type="button" class="outline" id="importBtn">Import stats</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <p class="note" id="backupMsg" hidden></p>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <span class="label">Per letter and syllable</span>
    <span class="muted" style="font-size:13px">Most failed first</span>
  </div>
  <div class="card table" id="sTable"></div>
</section>

<script>
(function () {
  'use strict';
  var KEY = 'hangulQuiz.v1';
  var MODES = { random: 'Random', least: 'Least tested', failed: 'Most failed' };
  var items = [];
  var data = load();
  var session = null;
  var busy = false;

  // ---------- storage ----------
  function blank() { return { stats: {}, sessions: [], settings: { length: 20, mode: 'least', cats: [] } }; }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY));
      if (d && typeof d.stats === 'object' && Array.isArray(d.sessions)) {
        d.settings = d.settings || { length: 20, mode: 'least' };
        if (!Array.isArray(d.settings.cats)) d.settings.cats = [];
        return d;
      }
    } catch (e) {}
    return blank();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function st(c) { return data.stats[c] || { shown: 0, correct: 0, wrong: 0, last: null }; }

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function show(id) { ['home', 'quiz', 'result', 'stats'].forEach(function (s) { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }
  function tokens(rom) { return String(rom).toLowerCase().split('/').map(function (s) { return s.trim(); }).filter(Boolean); }
  function clash(a, b) { var ta = tokens(a.rom), tb = tokens(b.rom); return ta.some(function (t) { return tb.indexOf(t) !== -1; }); }
  function group(it) { return /syllable/i.test(it.type) ? 'syl' : 'let'; }

  // ---------- CSV ----------
  function parseCSV(text) {
    var rows = [], row = [], cell = '', q = false;
    text = text.replace(/^﻿/, '');
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function toItems(rows) {
    var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var iC = head.indexOf('character'), iP = head.indexOf('polish reading'), iR = head.indexOf('romanisation'), iT = head.indexOf('type');
    if (iC < 0 || iR < 0) throw new Error('characters.csv needs the columns Character and Romanisation.');
    var seen = {}, out = [];
    rows.slice(1).forEach(function (r) {
      var c = (r[iC] || '').trim(), rom = (r[iR] || '').trim();
      if (!c || !rom || seen[c]) return;
      seen[c] = 1;
      out.push({ c: c, rom: rom, pl: iP >= 0 ? (r[iP] || '').trim() : '', type: iT >= 0 ? (r[iT] || '').trim() : '' });
    });
    return out;
  }

  // ---------- categories ----------
  // settings.cats = [] means All; otherwise the ticked Type values.
  function categories() {
    var seen = {}, out = [];
    items.forEach(function (i) { var t = i.type || 'Other'; if (!seen[t]) { seen[t] = 1; out.push(t); } });
    return out;
  }
  function cleanCats() {
    var all = categories();
    data.settings.cats = (data.settings.cats || []).filter(function (c) { return all.indexOf(c) !== -1; });
    if (data.settings.cats.length === all.length) data.settings.cats = [];
  }
  function selected() {
    var cats = data.settings.cats;
    if (!cats.length) return items;
    return items.filter(function (i) { return cats.indexOf(i.type || 'Other') !== -1; });
  }
  var TICK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  function renderCats() {
    var cats = data.settings.cats;
    var html = '<button type="button" class="chip" data-cat="" aria-pressed="' + (!cats.length) + '">' + TICK + 'All</button>';
    categories().forEach(function (c) {
      html += '<button type="button" class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (cats.indexOf(c) !== -1) + '">' + TICK + esc(c) + '</button>';
    });
    $('cats').innerHTML = html;
  }
  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var c = b.dataset.cat, cats = data.settings.cats;
    if (!c) cats = [];
    else if (cats.indexOf(c) !== -1) cats = cats.filter(function (x) { return x !== c; });
    else cats = cats.concat([c]);
    data.settings.cats = cats; cleanCats(); save(); renderHome();
  });

  // ---------- picking ----------
  function pick(n, mode) {
    var pool = shuffle(selected());
    if (mode === 'least') {
      pool.sort(function (a, b) { return st(a.c).shown - st(b.c).shown; });
    } else if (mode === 'failed') {
      var failed = pool.filter(function (i) { return st(i.c).wrong > 0; });
      var rest = pool.filter(function (i) { return st(i.c).wrong === 0; });
      failed.sort(function (a, b) {
        var A = st(a.c), B = st(b.c);
        return (B.wrong / B.shown) - (A.wrong / A.shown) || B.wrong - A.wrong;
      });
      rest.sort(function (a, b) { return st(a.c).shown - st(b.c).shown; });
      pool = failed.concat(rest);
    }
    return pool.slice(0, Math.min(n, pool.length));
  }
  function options(q) {
    function from(list) {
      var chosen = [];
      shuffle(list).forEach(function (it) {
        if (chosen.length >= 3 || it.c === q.c || clash(it, q)) return;
        if (chosen.some(function (o) { return clash(o, it); })) return;
        chosen.push(it);
      });
      return chosen;
    }
    var sel = selected();
    var pools = [sel, items.filter(function (i) { return group(i) === group(q); }), items];
    var opts = [];
    pools.forEach(function (pool) {
      if (opts.length >= 3) return;
      var more = from(pool).filter(function (it) { return !opts.some(function (o) { return o.c === it.c || clash(o, it); }); });
      opts = opts.concat(more).slice(0, 3);
    });
    return shuffle(opts.concat([q]));
  }

  // ---------- home ----------
  function renderHome() {
    var shown = 0, correct = 0, untested = 0;
    items.forEach(function (i) { var s = st(i.c); shown += s.shown; correct += s.correct; if (!s.shown) untested++; });
    $('tSessions').textContent = data.sessions.length;
    $('tAccuracy').textContent = shown ? Math.round(100 * correct / shown) + '%' : '–';
    $('tUntested').textContent = untested;
    Array.prototype.forEach.call(document.querySelectorAll('#lengths button'), function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.len === data.settings.length));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === data.settings.mode));
    });
    renderCats();
    $('startBtn').disabled = items.length < 4;
  }
  $('lengths').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    data.settings.length = +b.dataset.len; save(); renderHome();
  });
  $('modes').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    data.settings.mode = b.dataset.mode; save(); renderHome();
  });

  // ---------- quiz ----------
  function start() {
    var qs = pick(data.settings.length, data.settings.mode);
    session = { mode: data.settings.mode, qs: qs, i: 0, correct: 0, missed: [] };
    $('qMode').textContent = MODES[session.mode];
    show('quiz');
    renderQ();
  }
  function renderQ() {
    var q = session.qs[session.i];
    busy = false;
    session.opts = options(q);
    $('qCount').textContent = (session.i + 1) + ' / ' + session.qs.length;
    $('qBar').style.width = (100 * session.i / session.qs.length) + '%';
    $('qChar').textContent = q.c;
    $('qType').textContent = q.type;
    $('qOpts').innerHTML = session.opts.map(function (o, k) {
      return '<button type="button" class="opt" data-k="' + k + '"><b>' + esc(o.rom) + '</b>' + (o.pl ? '<span>(' + esc(o.pl) + ')</span>' : '') + '</button>';
    }).join('');
  }
  $('qOpts').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || busy) return;
    busy = true;
    var q = session.qs[session.i], o = session.opts[+b.dataset.k], right = o.c === q.c;
    var s = st(q.c);
    s.shown++; if (right) s.correct++; else s.wrong++; s.last = new Date().toISOString();
    data.stats[q.c] = s; save();
    var btns = $('qOpts').children;
    for (var k = 0; k < btns.length; k++) if (session.opts[k].c === q.c) btns[k].classList.add('ok');
    if (right) session.correct++;
    else { b.classList.add('bad'); session.missed.push({ c: q.c, rom: q.rom, picked: o.rom }); }
    setTimeout(next, right ? 700 : 1600);
  });
  function next() {
    session.i++;
    if (session.i < session.qs.length) renderQ(); else finish();
  }
  function finish() {
    var total = session.qs.length;
    data.sessions.push({ date: new Date().toISOString(), length: total, mode: session.mode, correct: session.correct, missed: session.missed });
    save();
    $('rMeta').textContent = 'Session saved · ' + total + ' questions · ' + MODES[session.mode];
    $('rScore').textContent = session.correct + ' / ' + total;
    $('rPct').textContent = Math.round(100 * session.correct / total) + '%';
    $('rMissed').innerHTML = session.missed.length ? session.missed.map(function (m) {
      return '<div class="row"><span class="ko" lang="ko">' + esc(m.c) + '</span><span class="r">' + esc(m.rom) + '</span><span class="p">you picked ' + esc(m.picked) + '</span></div>';
    }).join('') : '<div class="empty">Nothing missed.</div>';
    show('result');
  }
  $('quitBtn').addEventListener('click', function () {
    if (window.confirm('Quit this session? Answers so far stay in the statistics, but the session is not saved.')) { session = null; renderHome(); show('home'); }
  });

  // ---------- stats ----------
  function renderStats() {
    var tested = items.filter(function (i) { return st(i.c).shown; });
    var untested = items.filter(function (i) { return !st(i.c).shown; });
    tested.sort(function (a, b) {
      var A = st(a.c), B = st(b.c);
      return (A.correct / A.shown) - (B.correct / B.shown) || B.wrong - A.wrong;
    });
    var html = '<div class="trow thead"><span>Char</span><span>Sound</span><span class="num">Tested</span><span class="num">Right</span></div>';
    tested.concat(untested).forEach(function (i) {
      var s = st(i.c), pct = s.shown ? Math.round(100 * s.correct / s.shown) : null;
      html += '<div class="trow"><span class="ko" lang="ko">' + esc(i.c) + '</span><span style="font-size:16px;font-weight:600">' + esc(i.rom) + '</span><span class="num">' + s.shown + '</span><span class="num' + (pct !== null && pct < 75 ? ' low' : '') + '">' + (pct === null ? '–' : pct + '%') + '</span></div>';
    });
    $('sTable').innerHTML = html;
  }
  function msg(t) { $('backupMsg').textContent = t; $('backupMsg').hidden = !t; }
  $('exportBtn').addEventListener('click', function () {
    var day = new Date().toISOString().slice(0, 10);
    var name = 'hangul-quiz-backup-' + day + '.json';
    var json = JSON.stringify({ app: 'hangul-quiz', version: 1, exported: new Date().toISOString(), data: data }, null, 1);
    var file;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Hangul Quiz backup' }).then(function () { msg('Backup shared.'); }).catch(function () {});
      return;
    }
    var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    msg('Backup downloaded as ' + name + '.');
  });
  $('importBtn').addEventListener('click', function () { $('importFile').value = ''; $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result), d = j && j.data;
        if (!d || typeof d.stats !== 'object' || !Array.isArray(d.sessions)) throw new Error();
        if (!window.confirm('Replace your current statistics with this backup? This cannot be undone.')) return;
        d.settings = d.settings || data.settings;
        if (!Array.isArray(d.settings.cats)) d.settings.cats = [];
        data = d; save(); renderStats(); renderHome();
        msg('Backup imported: ' + d.sessions.length + ' sessions.');
      } catch (e) { msg('That file is not a Hangul Quiz backup.'); }
    };
    r.readAsText(f);
  });

  // ---------- navigation ----------
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('homeBtn').addEventListener('click', function () { renderHome(); show('home'); });
  $('statsBtn').addEventListener('click', function () { msg(''); renderStats(); show('stats'); });
  $('backBtn').addEventListener('click', function () { renderHome(); show('home'); });

  // ---------- boot ----------
  renderHome();
  fetch('characters.csv').then(function (r) {
    if (!r.ok) throw new Error('Could not load characters.csv (' + r.status + ').');
    return r.text();
  }).then(function (t) {
    items = toItems(parseCSV(t));
    var letters = items.filter(function (i) { return group(i) === 'let'; }).length;
    $('countLine').textContent = letters + ' letters and ' + (items.length - letters) + ' syllables';
    cleanCats(); save();
    renderHome();
  }).catch(function (e) {
    $('countLine').textContent = '';
    $('loadError').textContent = e.message || 'Could not load the character list.';
    $('loadError').hidden = false;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
